name: Deploy project site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site asset bundle
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/Diagrams/Activity_Diagram.jpeg _site/assets/activity-diagram.jpeg
          cp docs/Diagrams/er_diagram.jpeg _site/assets/er-diagram.jpeg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
